<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Break</title>
<link rel="stylesheet" href="brand.css">
<style>
  /* Break screen: big clock, optional resume time (?until=14:30), small logo. Transparent over the background scene. */
  .wrap { position: absolute; inset: 0; padding-top: 150px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .logo { position: absolute; top: 56px; left: 50%; transform: translateX(-50%); }
  .t { font-size: 104px; text-align: center; line-height: 1; }
  .clock { margin-top: 36px; font-size: 260px !important; font-family: var(--display); font-variation-settings: "wght" 700, "wdth" 75; font-size: 300px; line-height: 1; font-variant-numeric: tabular-nums;
    background: #fff; color: #0B0D12; padding: 0.04em 0.18em 0.02em; border-radius: 0.08em; position: relative; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,0.4); }
  .clock::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 0.06em; background: var(--primary); }
  .until { margin-top: 46px; font-size: 44px; text-align: center; }
  .until b { color: var(--primary); font-weight: 700; }
</style>
</head>
<body>
<div class="logo" id="logo"></div>
<div class="wrap">
  <div class="t display" id="t"></div>
  <div class="clock" id="clock"></div>
  <div class="until" id="until" hidden></div>
</div>
<script src="config.js"></script><script src="brand.js"></script>
<script>
  const { S, bi, logoHtml, main, second } = BRAND;
  document.getElementById('logo').innerHTML = logoHtml(150);
  document.getElementById('t').innerHTML = bi(S.breakText || { cs: 'Přestávka', en: 'Break' });
  const until = new URLSearchParams(location.search).get('until');
  if (until) {
    const el = document.getElementById('until');
    const txt = { cs: `Pokračujeme v <b>${until}</b>`, en: `We continue at <b>${until}</b>` };
    el.innerHTML = txt[main] + (second && txt[second] ? `<span class="second">${txt[second]}</span>` : '');
    el.hidden = false;
  }
  const clock = document.getElementById('clock');
  const tick = () => { clock.textContent = new Date().toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit' }); };
  tick(); setInterval(tick, 1000);
</script>
</body>
</html>
